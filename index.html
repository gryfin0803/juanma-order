<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>娟嬤餛飩線上訂購</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #fff7f2;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Microsoft JhengHei",
        sans-serif;
      color: #3b302b;
    }

    .box {
      max-width: 420px;
      margin: 40px auto;
      background: white;
      border-radius: 18px;
      padding: 26px 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    .desc {
      text-align: center;
      font-size: 14px;
      color: #806f66;
      line-height: 1.7;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: 1px solid #ddd0c8;
      border-radius: 10px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #e77950;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #8b7770;
    }

  </style>
</head>

<body>

<div class="box">

  <h2>🥟 娟嬤餛飩</h2>

  <div class="desc">
    開始訂購前，請先輸入您的聯絡電話。<br>
    完成訂購後，我們會透過 LINE 傳送訂單確認訊息 ♡
  </div>

  <label for="phone">
    聯絡電話
  </label>

  <input
    id="phone"
    type="tel"
    inputmode="numeric"
    maxlength="10"
    placeholder="09xxxxxxxx"
  >

  <button
    id="startBtn"
    onclick="startOrder()"
  >
    開始訂購
  </button>

  <div id="status">
    正在連接 LINE...
  </div>

</div>


<script>

const LIFF_ID =
  '2011072185-M96N0303';


const SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbzB8dO1_R0a3xuoTSkU4O2itIiLVv4ODMC7_uOb75NtJHzTn3lD5mgjAM_OXBBLgIBZcA/exec';


const GOOGLE_FORM_URL =
  'https://docs.google.com/forms/d/e/1FAIpQLSfDNrH98SfBcTH_YrDcVEeLVw3EtIJgmIURo8K_3-TATKzc5Q/viewform';


let lineUserId = '';


// ==========================
// 初始化 LINE
// ==========================

async function main() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }

    const profile =
      await liff.getProfile();

    lineUserId =
      profile.userId;

    document.getElementById(
      'status'
    ).innerText =
      '';

  } catch (error) {

    document.getElementById(
      'status'
    ).innerText =
      'LINE 連線失敗：' +
      error.message;

  }

}


// ==========================
// 開始訂購
// ==========================

function startOrder() {

  const phone =
    document.getElementById(
      'phone'
    ).value.trim();


  if (!/^09\d{8}$/.test(phone)) {

    alert(
      '請輸入正確的手機號碼，例如 0912345678'
    );

    return;

  }


  if (!lineUserId) {

    alert(
      'LINE 身分尚未取得，請稍候再試一次'
    );

    return;

  }


  const button =
    document.getElementById(
      'startBtn'
    );


  button.disabled = true;

  button.innerText =
    '正在開啟訂購表單...';


  document.getElementById(
    'status'
  ).innerText =
    '正在綁定 LINE 身分...';


  // 建立跨網域綁定請求
  const script =
    document.createElement(
      'script'
    );


  script.src =
    SCRIPT_URL +
    '?action=bindLine' +
    '&phone=' +
    encodeURIComponent(phone) +
    '&lineUserId=' +
    encodeURIComponent(lineUserId) +
    '&callback=bindingDone' +
    '&t=' +
    Date.now();


  document.body.appendChild(
    script
  );

}


// ==========================
// 綁定完成
// ==========================

function bindingDone() {

  document.getElementById(
    'status'
  ).innerText =
    '正在開啟訂購表單...';


  window.location.replace(
    GOOGLE_FORM_URL
  );

}


main();

</script>

</body>
</html>
